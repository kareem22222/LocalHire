services:
  database:
    container_name: localhire-database
    image: postgres:17.10-alpine3.23
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-localhire_dev}
      POSTGRES_USER: ${LOCAL_DB_USERNAME:-localhire_admin}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-localhire_dev_password}
    volumes:
      - localhire-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${LOCAL_DB_USERNAME:-localhire_admin} -d ${LOCAL_DB_NAME:-localhire_dev}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    container_name: localhire-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MockData__SeedOnStartup: "true"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ConnectionStrings__DefaultConnection: >-
        Host=database;
        Port=5432;
        Database=${LOCAL_DB_NAME:-localhire_dev};
        Username=${LOCAL_DB_USERNAME:-localhire_admin};
        Password=${LOCAL_DB_PASSWORD:-localhire_dev_password};
        SSL Mode=Disable;
        Timeout=15;
        Command Timeout=30
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  localhire-postgres-data:
