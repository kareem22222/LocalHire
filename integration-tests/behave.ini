[behave]
color = true
show_timings = true
stdout_capture = false
stderr_capture = false
log_capture = false
logging_level = INFO
format = pretty
junit = false
# @rate_limit needs the API started with the production-like limit
# (AUTH_RATE_LIMIT_PERMITS=5). The compose stack raises it so a whole run is not
# throttled, so the scenario is opt-in:
#   behave --tags=rate_limit -D auth_rate_limit_permits=5
tags = not @rate_limit

[behave.userdata]
# --- API under test -------------------------------------------------------
# Everything below can be overridden per run with -D key=value, or with an
# environment variable named LOCALHIRE_<KEY IN UPPER CASE>, e.g.
#   behave -D api_base_url=http://127.0.0.1:8080/api/
#   $env:LOCALHIRE_API_BASE_URL = "http://127.0.0.1:8080/api/"
api_base_url = http://localhost:8080/api/
api_ready_timeout_seconds = 240
request_timeout_seconds = 60

# --- PostgreSQL (published by docker compose on 5433) --------------------
db_host = localhost
db_port = 5433
db_name = localhire_dev
db_username = localhire_admin
db_password = localhire_dev_password

# --- Per-scenario database reset -----------------------------------------
# recreate: DROP SCHEMA public CASCADE + re-run every EF Core migration, so
#           every scenario starts from tables built from scratch (default).
# truncate: empty every table instead. Same isolation, noticeably faster.
reset_mode = recreate

# --- LocalStack S3 (docker compose --profile localstack) ------------------
s3_endpoint_url = http://localhost:4566
s3_bucket = localhire-resumes-dev
aws_region = ap-south-2
aws_access_key_id = test
aws_secret_access_key = test

# --- Shared credentials for the seeded accounts --------------------------
test_password = LocalHire1!

# Must match the API's Auth__RateLimit__PermitLimit for @rate_limit scenarios.
auth_rate_limit_permits = 5

# Only needed by scenarios tagged @jwt_secret (forged/expired token checks).
# Must match the API's Jwt__Secret. Left empty on purpose: set JWT_SECRET in the
# shell, or pass -D jwt_secret=...
jwt_secret =
