# SonarCloud CI-based analysis configuration.
#
# Coverage is imported by the SonarScanner for .NET, which is driven from
# .github/workflows/sonarcloud.yml. That scanner reads its parameters from the
# workflow command line (/d:...), so the coverage/exclusion values below are
# mirrored there and kept here for reference and portability. Coverage is NOT
# supported by SonarCloud automatic analysis, so automatic analysis must be
# turned OFF in the project settings (Administration > Analysis Method).

sonar.projectKey=kareem22222_LocalHire
sonar.organization=kareem22222

# Coverage reports produced during the build.
# Frontend (Vitest v8 -> LCOV) and backend (Coverlet -> OpenCover).
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml

# Generated EF Core migrations and build output are noise for analysis.
sonar.exclusions=backend/Data/Migrations/**,backend/wwwroot/**,frontend/coverage/**,frontend/dist/**
sonar.cpd.exclusions=backend/Data/Migrations/**
sonar.coverage.exclusions=backend/Data/Migrations/**,**/*.spec.js,**/test/**,**/__tests__/**
