name: Integration tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behave:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integration-tests/requirements.txt

      - name: Install test dependencies
        working-directory: integration-tests
        run: pip install -r requirements.txt

      - name: Write the local env file
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          JWT_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::${JWT_SECRET}"
          {
            echo "LOCAL_DB_NAME=localhire_dev"
            echo "LOCAL_DB_USERNAME=localhire_admin"
            echo "LOCAL_DB_PASSWORD=localhire_dev_password"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "AWS_S3_BUCKET=localhire-resumes-dev"
            echo "AWS_REGION=ap-south-2"
            echo "AWS_ACCESS_KEY_ID=test"
            echo "AWS_SECRET_ACCESS_KEY=test"
            echo "LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}"
          } > .env
          # LocalStack Pro needs a token. Without one the S3 features skip
          # themselves, so the rest of the suite still runs.
          if [ -n "${LOCALSTACK_AUTH_TOKEN}" ]; then
            echo "AWS_SERVICE_URL=http://localstack:4566" >> .env
            echo "AWS_PUBLIC_SERVICE_URL=http://localhost:4566" >> .env
            echo "COMPOSE_PROFILES=localstack" >> "$GITHUB_ENV"
          else
            echo "AWS_SERVICE_URL=" >> .env
            echo "AWS_PUBLIC_SERVICE_URL=" >> .env
          fi
          echo "JWT_SECRET=${JWT_SECRET}" >> "$GITHUB_ENV"

      - name: Start the stack
        run: |
          if [ -n "${COMPOSE_PROFILES:-}" ]; then
            docker compose --profile localstack up -d --build
          else
            docker compose up -d --build
          fi

      - name: Wait for the API
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "API is healthy after ${attempt} attempt(s)."
              curl -sf http://localhost:8080/api/test-support/ping
              exit 0
            fi
            sleep 5
          done
          echo "The API never became healthy." >&2
          docker compose logs --tail 200 api >&2
          exit 1

      - name: Run the integration suite
        working-directory: integration-tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p reports
          behave --junit --junit-directory reports -f pretty

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p integration-tests/reports
          docker compose logs --no-color --tail 2000 > integration-tests/reports/docker-compose.log || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration-tests/reports
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose --profile localstack down --volumes --remove-orphans
